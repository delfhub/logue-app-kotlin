name: Build debug APK

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept SDK licenses and install API 37 platform
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/cmdline-tools" || true
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platform-tools" "build-tools;37.0.0" || true
          # API 37 ships as a minor-versioned platform; try both spellings.
          "$SDKMANAGER" "platforms;android-37" || "$SDKMANAGER" "platforms;android-37.0"
          ls "$ANDROID_HOME/platforms" || true

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: logue-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
